    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Prevent scroll restoration to bottom on reload or initial visit -->
    <script>
      try {
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }
        if (window.location.hash) {
          history.replaceState(null, '', window.location.pathname);
        }
        window.scrollTo(0, 0);
        window.addEventListener('load', function() {
          window.scrollTo(0, 0);
        });
      } catch (e) {}
    </script>
  </head>
  <body class="chaos-mode">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
